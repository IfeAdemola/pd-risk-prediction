name: ppmi_mri

description: >
  Quantitative MRI variables for survival prediction of
  Parkinson's disease conversion in the PPMI at-risk cohort.
  Data are derived from the PPMI MRI Core Lab - Quantitative MRI dataset.

modality: mri

timepoint:
  baseline: true # cross-sectional rather than longitudinal (all entries are at baseline visit)

identifiers:
  - PATNO
  - EVENT_ID

